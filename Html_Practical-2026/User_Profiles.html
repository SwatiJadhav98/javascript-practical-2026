<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Profile Details</title>
    <style>
      body{
        background-color:rgb(213, 233, 233);
      }
    </style>
  </head>
  <body>
    <header align="center">
      <h1>User Profile Details</h1>   
    </header>
    <form action="Thankyou.php" method="post">
      <table align="center" height="400px">
        <tr>
          <td><label for="fname">First Name : </label></td>
          <td><input type="text" placeholder="First Name" id="fname" /></td>
        </tr>
        <tr>
          <td><label for="lname">Last Name : </label></td>
          <td><input type="text" placeholder="Last Name" id="lname" /></td>
        </tr>
        <tr>
          <td><label for="gender">Gender : </label></td>
          <td>
            <input type="radio" name="gender" id="gender" />Male
            <input type="radio" name="gender" id="gender" />Female
          </td>
        </tr>
        <tr>
          <td><label for="dob"> Date Of Birth :</label></td>
          <td><input type="date" id="dob" /></td>
        </tr>
        <tr>
          <td><label for="email">Email Id : </label></td>
          <td><input type="email" placeholder="Email Address" id="email" /></td>
        </tr>
        <tr>
          <td><label for="mobno">Mobile No : </label></td>
          <td><input type="number" placeholder="Mobile Number" id="mobno" /></td>
        </tr>
        <tr>
          <td><label for="address">Address : </label></td>
          <td>
            <input type="textarea" placeholder="Home Address " id="address" />
          </td>
        </tr>
        <tr>
          <td><label for="pincode">Pincode : </label></td>
          <td><input type="text" placeholder="Pincode" id="pincode" /></td>
        </tr>
        <tr>
          <td><label for="bgroup">Blood Group : </label></td>
          <td>
            <select id="bgroup">
              <option>A+</option>
              <option>B+</option>
              <option>O+</option>
              <option>AB+</option>
              <option>AB-</option>    
            </select>
          </td>
        </tr>
        <tr>
          <td><label for="hobbies">Hobbies : </label></td>
          <td>
            <input type="checkbox" id="hobbies"/>Reading
            <input type="checkbox" id="hobbies"/>Writing
            <input type="checkbox" id="hobbies"/>Travelling
          </td><br/><br/>
        </tr>
         <tr>
          <td><label for="profile">User Profile : </label></td>
          <td>
            <input type="file"  id="profile" name="userprofile" accept="image/*"/>
          </td>
        </tr>
        <tr>
          <td colspan="2" align="center">
            <input type="submit" value="Submit" />
          </td>
        </tr>
      </table>
    </form>
  </body>
</html>
